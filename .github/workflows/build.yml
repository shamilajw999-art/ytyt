name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Upgraded to JDK 21 (Required to run Gradle 9.3+)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Upgraded to setup-gradle@v4 which handles Gradle 9+ cleanly
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    # Upgraded the engine generation explicitly to version 9.3.1 as demanded by the logs
    - name: Fix and Regenerate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew

    - name: Build Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: app/build/outputs/bundle/release/*.aab
