name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Upgraded setup-java package to v5 to fix deprecation warning
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    # Regenerating with a highly stable version for AI Studio Kotlin apps
    - name: Fix and Regenerate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x gradlew

    # Running with --stacktrace so we can pinpoint any raw Kotlin code issues instantly
    - name: Build Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: app/build/outputs/bundle/release/*.aab
