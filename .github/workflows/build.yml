name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup JDK 21 required for modern Gradle configurations
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    # Regenerates wrapper precisely matching your build plugin specifications
    - name: Fix and Regenerate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew

    # Injects a fallback instruction forcing the release build to inherit the default unsigned fallback configurations
    - name: Force Unsigned Release Variant Configuration
      run: |
        find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs/d' {} +
        find . -name "build.gradle.kts" -exec sed -i 's/signingConfig = .*/signingConfig = signingConfigs.getByName("debug")/g' {} +

    - name: Build Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: app/build/outputs/bundle/release/*.aab
