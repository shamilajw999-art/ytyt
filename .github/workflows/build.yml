name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Fix and Regenerate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew

    # This script injects an instruction to strip the missing keystore rule before compilation
    - name: Bypass Keystore Signing Requirement
      run: |
        find . -name "build.gradle*" -exec sed -i '/signingConfig signingConfigs.release/d' {} +
        find . -name "build.gradle*" -exec sed -i '/signingConfigs {/,/^    }/d' {} +

    - name: Build Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: app/build/outputs/bundle/release/*.aab
